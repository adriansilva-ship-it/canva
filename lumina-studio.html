<style type="text/tailwindcss">
@layer components{
 .btn{@apply inline-flex items-center gap-1.5 px-3 h-9 rounded-xl text-sm font-medium bg-white/70 dark:bg-white/10 hover:bg-white dark:hover:bg-white/20 border border-slate-200 dark:border-white/10 transition active:scale-95 whitespace-nowrap}

 .ib.on{@apply bg-indigo-600 text-white}
 .inp{@apply h-8 px-2 rounded-lg text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-white/10 outline-none focus:ring-2 focus:ring-indigo-400}
 .glass{@apply bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-slate-200/70 dark:border-white/10}

 .chip.on{@apply bg-indigo-600 text-white border-indigo-600}

<style>
body{font-family:Inter,system-ui,sans-serif}
.el{cursor:move;user-select:none}.el .in{width:100%;height:100%}
.el.locked{cursor:default}
#stage{box-shadow:0 20px 60px rgba(30,27,75,.25);position:absolute;left:0;top:0;transform-origin:0 0;width:960px;height:540px}.sl{position:relative;overflow:hidden}.cp:hover{opacity:.8}
.hd{position:absolute;background:#fff;border:2px solid #6366f1;border-radius:3px;pointer-events:auto;z-index:5}
.gl{position:absolute;background:#ec4899;pointer-events:none;z-index:6}
@keyframes a-appear{0%{opacity:0}1%{opacity:1}100%{opacity:1}}
@keyframes a-fade{from{opacity:0}to{opacity:1}}
@keyframes a-slide{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
@keyframes a-zoom{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@keyframes a-neon{0%,19%,22%,62%,64%,100%{filter:brightness(1.6) drop-shadow(0 0 10px #22d3ee)}20%,21%,63%{filter:none;opacity:.5}}
@keyframes t-fade{from{opacity:0}to{opacity:1}}
@keyframes t-slide{from{transform:translateX(100%)}to{transform:none}}
@keyframes t-zoom{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes t-flip{from{transform:perspective(900px) rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.pop{animation:t-zoom .18s ease-out}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#94a3b855;border-radius:8px}
input[type=color]{width:28px;height:28px;padding:0;border:none;background:none;cursor:pointer;border-radius:8px}

 <div class="flex flex-1 min-h-0">

  <main class="flex-1 min-w-0 flex flex-col">
   <div id="inspector" class="glass border-b min-h-[52px] px-3 py-1.5 flex flex-wrap items-center gap-x-2 gap-y-1 z-10 shrink-0"></div>

<script>
'use strict';
const SW=960,SH=540;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
/* ===================== UTILIDADES ===================== */
class U{
 static uid(p='i'){return p+Math.random().toString(36).slice(2,9)}
 static clamp(v,a,b){return Math.min(b,Math.max(a,v))}
 static esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 static norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
 static clone(o){return JSON.parse(JSON.stringify(o))}
 static hexToRgb(h){h=String(h).replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255]}
 static rgbToHex(r,g,b){return'#'+[r,g,b].map(v=>U.clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
 static hexToHsl(hex){const[r,g,b]=U.hexToRgb(hex).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
 static hslToHex(h,s,l){h=((h%360)+360)%360;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;const t=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return U.rgbToHex((t[0]+m)*255,(t[1]+m)*255,(t[2]+m)*255)}
 static lum(hex){const[r,g,b]=U.hexToRgb(hex);return(.299*r+.587*g+.114*b)/255}
 static isHex(v){return typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v)}
 static harmony(hex,type){const[h,s,l]=U.hexToHsl(hex);const sets={complementary:[0,180],analogous:[-30,0,30],triadic:[0,120,240],tetradic:[0,90,180,270],split:[0,150,210]};
  if(type==='monochrome')return[.15,.3,.5,.7,.88].map(L=>U.hslToHex(h,s,L));
  return(sets[type]||[0]).map(o=>U.hslToHex(h+o,s,l)).concat(type==='complementary'?[U.hslToHex(h,s,Math.min(.92,l+.3)),U.hslToHex(h+180,s,Math.max(.12,l-.25)),U.hslToHex(h,s*.4,.95)]:[])}
 static download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
 static time(ms){const s=Math.floor(ms/1000);return[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':')}
 static ago(ts){const d=(Date.now()-ts)/1000;if(d<10)return'ahora mismo';if(d<60)return`hace ${Math.floor(d)} s`;if(d<3600)return`hace ${Math.floor(d/60)} min`;if(d<86400)return`hace ${Math.floor(d/3600)} h`;return new Date(ts).toLocaleDateString('es')}
 static debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
 static fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
 static loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
 static async shrink(src,max=1100){const i=await U.loadImg(src);const k=Math.min(1,max/Math.max(i.width,i.height));if(k===1&&src.length<400000)return src;const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.drawImage(i,0,0,c.width,c.height);const png=/image\/(png|svg|gif)/.test(src.slice(0,30));return png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85)}
 static svgURI(svg){return'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
}
/* ===================== UI: modales y avisos ===================== */
class UI{
 static toast(msg,ok=true){const t=$('#toast');const d=document.createElement('div');d.className='pop px-4 py-2 mb-2 rounded-xl text-sm shadow-2xl text-white '+(ok?'bg-slate-900/95':'bg-rose-600');d.textContent=msg;t.appendChild(d);setTimeout(()=>d.remove(),2600)}
 static modal(title,html,o={}){const m=$('#modal');m.innerHTML=`<div class="fixed inset-0 z-50 grid place-items-center p-4 bg-slate-900/50 backdrop-blur-sm" data-close="1"><div class="pop glass rounded-2xl border shadow-2xl ${o.wide?'w-[min(1100px,96vw)]':'w-[min(560px,96vw)]'} max-h-[92vh] flex flex-col bg-white dark:bg-slate-900" role="dialog" aria-label="${U.esc(title)}"><div class="flex items-center px-5 py-3 border-b border-slate-200 dark:border-white/10"><h2 class="font-bold text-lg flex-1">${title}</h2><button class="ib" data-close="1" aria-label="Cerrar">✕</button></div><div id="mbody" class="p-5 overflow-auto">${html}</div></div></div>`;
  m.firstElementChild.addEventListener('mousedown',e=>{if(e.target.dataset.close&&(e.target===m.firstElementChild||e.target.tagName==='BUTTON'))UI.close()});UI.onClose=o.onClose;return $('#mbody')}
 static close(){$('#modal').innerHTML='';if(UI.onClose){const f=UI.onClose;UI.onClose=null;f()}}
 static get open(){return!!$('#modal').firstElementChild}
}
/* ===================== ALMACÉN (localStorage) ===================== */
class Store{
 static KEY='lumina.suite.v1';
 static data=null;
 static load(){let d=null;try{d=JSON.parse(localStorage.getItem(Store.KEY))}catch(e){d=null}
  if(!d||!d.projects||!Object.keys(d.projects).length)d=Store.fresh();
  d.brand=d.brand||Store.defaultBrand();d.shares=d.shares||{};d.access=d.access||[];d.uploads=d.uploads||[];d.user=d.user||{id:'u0',name:'Adrian',color:'#6366f1'};
  if(!d.projects[d.currentId])d.currentId=Object.keys(d.projects)[0];Store.data=d;return d}
 static defaultBrand(){return{palettes:[
  {name:'Universidad Clásica',colors:['#1e3a8a','#3b82f6','#fbbf24','#f8fafc','#0f172a']},
  {name:'Ciencia Vibrante',colors:['#0f766e','#14b8a6','#f97316','#f0fdfa','#134e4a']},
  {name:'Atardecer Creativo',colors:['#be185d','#f43f5e','#fb923c','#fff7ed','#4c0519']},
  {name:'Bosque Académico',colors:['#14532d','#16a34a','#a3e635','#f7fee7','#052e16']},
  {name:'Corporativo Azul',colors:['#0b1f3a','#2563eb','#38bdf8','#f1f5f9','#64748b']},
  {name:'Neón Nocturno',colors:['#0b0b1e','#7c3aed','#22d3ee','#f0abfc','#e2e8f0']},
  {name:'Papel & Tinta',colors:['#292524','#78716c','#b45309','#fef3c7','#fafaf9']},
  {name:'Pastel Suave',colors:['#6d28d9','#f9a8d4','#a5b4fc','#fde68a','#fdf4ff']}],
  fonts:[{name:'Inter',family:'Inter'},{name:'Poppins',family:'Poppins'},{name:'Montserrat',family:'Montserrat'},{name:'Playfair Display',family:'"Playfair Display"'},{name:'Merriweather',family:'Merriweather'},{name:'Space Grotesk',family:'"Space Grotesk"'},{name:'Caveat (manuscrita)',family:'Caveat'},{name:'Georgia',family:'Georgia'}],
  logos:[]}}
 static fresh(){const p=Templates.blank('Presentación sin título');return{user:{id:'u0',name:'Adrian',color:'#6366f1'},theme:'light',currentId:p.id,projects:{[p.id]:p},shares:{},access:[],uploads:[],brand:Store.defaultBrand()}}
 static get project(){return Store.data.projects[Store.data.currentId]}
 static save(){try{Store.data.projects[Store.data.currentId].updated=Date.now();localStorage.setItem(Store.KEY,JSON.stringify(Store.data));Store.status(true)}catch(e){Store.status(false);UI.toast('Almacenamiento local lleno: elimina imágenes o proyectos',false)}}
 static status(ok){const s=$('#status');if(!s)return;s.innerHTML=ok?`<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>Guardado en tiempo real · ${new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`:'<span class="text-rose-500">⚠ No se pudo guardar</span>'}
 static log(who,what,color){Store.data.access.unshift({who,what,color:color||'#6366f1',t:Date.now(),pid:Store.data.currentId});Store.data.access=Store.data.access.slice(0,80)}
}
/* ===================== BANCO DE RECURSOS ===================== */
class Assets{
 static poly(n,r=48,rot=-90){let p=[];for(let i=0;i<n;i++){const a=(rot+i*360/n)*Math.PI/180;p.push((50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1))}return p.join(' ')}
 static star(n,ro=48,ri=20){let p=[];for(let i=0;i<n*2;i++){const r=i%2?ri:ro,a=(-90+i*180/n)*Math.PI/180;p.push((50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1))}return p.join(' ')}
 static build(){
  const L=[];
  const add=(cat,id,name,tags,vb,body,o={})=>L.push({cat,id,name,tags:name+' '+tags,vb,body,ns:o.ns!==false&&cat!=='icons'&&cat!=='stickers'&&cat!=='illustrations',ar:o.ar||1,fill:o.fill||'#6366f1',stroke:o.stroke||'none',sw:o.sw||0});
  const G=(n)=>`<polygon points="${n}" fill="F" stroke="S" stroke-linejoin="round"/>`;
  const sh=(id,name,tags,body)=>add('shapes',id,name,'forma geometrica figura '+tags,'0 0 100 100',body);
  const PT=(d)=>`<path d="${d}" fill="F" stroke="S" stroke-linejoin="round"/>`;
  sh('rect','Rectángulo','cuadrado caja','<rect x="1" y="1" width="98" height="98" fill="F" stroke="S"/>');
  sh('rrect','Rectángulo redondeado','tarjeta boton','<rect x="1" y="1" width="98" height="98" rx="18" fill="F" stroke="S"/>');
  sh('circle','Círculo','elipse redondo','<ellipse cx="50" cy="50" rx="49" ry="49" fill="F" stroke="S"/>');
  sh('tri','Triángulo','piramide',G('50,2 98,98 2,98'));
  sh('rtri','Triángulo rectángulo','',G('2,98 2,2 98,98'));
  sh('diamond','Rombo','diamante',G('50,2 98,50 50,98 2,50'));
  sh('penta','Pentágono','',G(Assets.poly(5)));sh('hexa','Hexágono','panal celda',G(Assets.poly(6,48,0)));
  sh('hepta','Heptágono','',G(Assets.poly(7)));sh('octa','Octágono','stop señal',G(Assets.poly(8,48,-67.5)));
  sh('star5','Estrella','favorito calificacion',G(Assets.star(5,48,20)));sh('star4','Estrella de 4 puntas','brillo destello',G(Assets.star(4,48,14)));
  sh('star6','Estrella de 6 puntas','',G(Assets.star(6,48,26)));sh('burst','Explosión','oferta estallido',G(Assets.star(14,48,38)));
  sh('seal','Sello dentado','insignia',G(Assets.star(24,48,43)));
  sh('heart','Corazón','amor like',PT('M50 90 C10 60 2 38 12 22 C22 8 42 10 50 28 C58 10 78 8 88 22 C98 38 90 60 50 90Z'));
  sh('cloud','Nube','clima',PT('M25 80 C8 80 4 58 22 54 C20 34 44 26 54 40 C62 24 88 32 82 52 C98 54 98 80 78 80Z'));
  sh('arrowR','Flecha derecha','siguiente direccion',G('2,32 58,32 58,8 98,50 58,92 58,68 2,68'));
  sh('arrowL','Flecha izquierda','atras anterior',G('98,32 42,32 42,8 2,50 42,92 42,68 98,68'));
  sh('arrowU','Flecha arriba','subir crecimiento',G('32,98 32,42 8,42 50,2 92,42 68,42 68,98'));
  sh('arrowD','Flecha abajo','bajar',G('32,2 32,58 8,58 50,98 92,58 68,58 68,2'));
  sh('chev','Chevron','paso proceso',G('2,2 70,2 98,50 70,98 2,98 30,50'));
  sh('pent2','Pentágono flecha','proceso',G('2,2 70,2 98,50 70,98 2,98'));
  sh('plus','Cruz / Más','suma medico',G('35,2 65,2 65,35 98,35 98,65 65,65 65,98 35,98 35,65 2,65 2,35 35,35'));
  sh('para','Paralelogramo','',G('22,2 98,2 78,98 2,98'));sh('trap','Trapecio','',G('22,2 78,2 98,98 2,98'));
  sh('bubble','Globo de diálogo','dialogo comentario chat',PT('M10 8 H90 Q98 8 98 16 V60 Q98 68 90 68 H48 L24 92 L28 68 H10 Q2 68 2 60 V16 Q2 8 10 8Z'));
  sh('ring','Anillo','aro donut','<path d="M50 2a48 48 0 1 0 .1 0ZM50 24a26 26 0 1 1-.1 0Z" fill-rule="evenodd" fill="F" stroke="S"/>');
  sh('semi','Semicírculo','',PT('M2 80 A48 48 0 0 1 98 80Z'));
  sh('moon','Luna','noche',PT('M70 6 A46 46 0 1 0 94 70 A38 38 0 0 1 70 6Z'));
  sh('bolt','Rayo','energia electricidad',G('58,2 12,56 44,56 38,98 88,40 54,40'));
  sh('drop','Gota','agua',PT('M50 4 C50 4 12 46 12 64 A38 38 0 0 0 88 64 C88 46 50 4 50 4Z'));
  sh('ribbon','Cinta','banner titulo',G('2,20 98,20 86,50 98,80 2,80 14,50'));
  sh('blob1','Mancha orgánica','blob fondo',PT('M78 14 C96 30 98 62 80 82 C62 100 28 96 12 76 C-2 56 6 26 28 12 C44 2 62 2 78 14Z'));
  sh('blob2','Mancha líquida','blob fondo',PT('M60 4 C84 8 98 30 94 54 C90 78 64 98 40 92 C16 86 2 62 8 40 C14 18 36 0 60 4Z'));
  sh('wave','Ola','onda fondo',PT('M0 50 Q12.5 20 25 50 T50 50 T75 50 T100 50 V100 H0Z'));
  sh('quarter','Cuarto de círculo','esquina',PT('M2 98 V2 A96 96 0 0 1 98 98Z'));
  sh('arch','Arco','puerta ventana',PT('M2 98 V50 A48 48 0 0 1 98 50 V98Z'));

 static async removeBg(){const e=Editor.one();if(!e||e.type!=='image')return UI.toast('Selecciona una imagen',false);

   Share.online.forEach(o=>{if(Math.random()<.4)o.slide=Math.floor(Math.random()*Editor.project.slides.length)});Share.avatars();if($('#shareLive'))Share.liveList()};

class Raster{
 static async slide(s,scale=2){const c=document.createElement('canvas');c.width=SW*scale;c.height=SH*scale;const x=c.getContext('2d');x.scale(scale,scale);
  if(s.bg2){const a=(s.ang||135)*Math.PI/180,cx=SW/2,cy=SH/2,L=Math.abs(SW*Math.sin(a))/2+Math.abs(SH*Math.cos(a))/2;const g=x.createLinearGradient(cx-Math.sin(a)*L,cy+Math.cos(a)*L,cx+Math.sin(a)*L,cy-Math.cos(a)*L);g.addColorStop(0,s.bg);g.addColorStop(1,s.bg2);x.fillStyle=g}else x.fillStyle=s.bg;x.fillRect(0,0,SW,SH);
  for(const e of s.els){x.save();x.globalAlpha=e.op;x.translate(e.x+e.w/2,e.y+e.h/2);x.rotate((e.rot||0)*Math.PI/180);x.translate(-e.w/2,-e.h/2);
   try{if(e.type==='text')Raster.text(x,e);else if(e.type==='vec'||e.type==='chart'){const svg=e.type==='vec'?Assets.svg(e,e.w,e.h):Charts.svg(e,e.w,e.h);const i=await U.loadImg(U.svgURI(svg));Raster.shadow(x,e);x.drawImage(i,0,0,e.w,e.h)}
   else if(e.type==='image'){const i=await U.loadImg(e.src);Raster.shadow(x,e);const f=e.f;let fl=`brightness(${f.b}%) contrast(${f.c}%) saturate(${f.s}%)`+(f.bl?` blur(${f.bl}px)`:'');x.filter=fl;
    if(e.radius){x.beginPath();x.roundRect(0,0,e.w,e.h,Math.min(e.radius,e.w/2,e.h/2));x.clip()}
    const r=Math.max(e.w/i.width,e.h/i.height),dw=i.width*r,dh=i.height*r;
    if(f.duo){const m=x.getTransform(),sc=Math.max(1,Math.hypot(m.a,m.b)),t=document.createElement('canvas');t.width=Math.max(1,Math.round(e.w*sc));t.height=Math.max(1,Math.round(e.h*sc));const tx=t.getContext('2d',{willReadFrequently:true});tx.scale(sc,sc);tx.filter=fl;tx.drawImage(i,(e.w-dw)/2,(e.h-dh)/2,dw,dh);
     const id=tx.getImageData(0,0,t.width,t.height),D=id.data,A=U.hexToRgb(f.duo[0]),B=U.hexToRgb(f.duo[1]);for(let k=0;k<D.length;k+=4){const g=(D[k]+D[k+1]+D[k+2])/765;D[k]=A[0]+(B[0]-A[0])*g;D[k+1]=A[1]+(B[1]-A[1])*g;D[k+2]=A[2]+(B[2]-A[2])*g}tx.putImageData(id,0,0);x.filter='none';x.drawImage(t,0,0,e.w,e.h)}
    else x.drawImage(i,(e.w-dw)/2,(e.h-dh)/2,dw,dh)}}catch(err){console.warn('Elemento omitido en exportación',err)}
   x.restore()}
  return c}
 static shadow(x,e){if(e.shadow){x.shadowColor=e.shadow.color;x.shadowBlur=e.shadow.blur;x.shadowOffsetX=e.shadow.x;x.shadowOffsetY=e.shadow.y}}
 static text(x,e){const fs=`${e.italic?'italic ':''}${e.bold?'700 ':'400 '}${e.size}px ${e.font}`;x.font=fs;x.textBaseline='top';x.fillStyle=e.color;if(x.letterSpacing!==undefined)x.letterSpacing=e.ls+'px';
  const src=e.upper?e.text.toUpperCase():e.text;const lines=[];src.split('\n').forEach(par=>{if(!par){lines.push('');return}let cur='';par.split(/(\s+)/).forEach(w=>{const t=cur+w;if(x.measureText(t).width>e.w&&cur.trim()){lines.push(cur.trimEnd());cur=w.trimStart()}else cur=t});lines.push(cur.trimEnd())});
  Raster.shadow(x,e);const fx=e.fx;
  if(fx==='shadow'){x.shadowColor='rgba(0,0,0,.35)';x.shadowBlur=6;x.shadowOffsetX=3;x.shadowOffsetY=3}else if(fx==='lift'){x.shadowColor='rgba(0,0,0,.3)';x.shadowBlur=14;x.shadowOffsetY=6}else if(fx==='neon'){x.fillStyle='#fff';x.shadowColor=e.fxColor;x.shadowBlur=24}
  const lh=e.size*e.lh;lines.forEach((ln,i)=>{const w=x.measureText(ln).width;let px=e.align==='center'?(e.w-w)/2:e.align==='right'?e.w-w:0,py=i*lh+(lh-e.size)/2;
   if(fx==='bg'){x.save();x.shadowColor='transparent';x.fillStyle=e.fxColor;x.fillRect(px-4,py-2,w+8,e.size*1.2);x.restore()}
   if(fx==='echo'){x.save();x.fillStyle=e.fxColor+'55';x.fillText(ln,px+8,py+8);x.fillStyle=e.fxColor+'aa';x.fillText(ln,px+4,py+4);x.restore()}
   if(fx==='glitch'){x.save();x.fillStyle='#ff2d55';x.fillText(ln,px+3,py);x.fillStyle='#22d3ee';x.fillText(ln,px-3,py);x.restore()}
   if(fx==='hollow'){x.save();x.strokeStyle=e.color;x.lineWidth=2;x.strokeText(ln,px,py);x.restore()}else x.fillText(ln,px,py);
   if(fx==='outline'){x.save();x.shadowColor='transparent';x.strokeStyle=e.fxColor;x.lineWidth=1.5;x.strokeText(ln,px,py);x.restore()}
   if(e.u){x.save();x.shadowColor='transparent';x.fillRect(px,py+e.size*1.05,w,Math.max(1,e.size/16));x.restore()}})}
 static blob(c,type,q){return new Promise(r=>c.toBlob(r,type,q))}
}
class Zip{
 static crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
 static crc(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=Zip.crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
 static build(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  files.forEach(f=>{const nm=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=Zip.crc(data);
   const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
   parts.push(new Uint8Array(h.buffer),nm,data);
   const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);cd.push(new Uint8Array(c.buffer),nm);
   off+=30+nm.length+data.length});
  let cds=0;cd.forEach(p=>cds+=p.length);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cds,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)])}
}

class Presenter{
 static i=0;static t0=0;static timer=null;static on=false;static view='speaker';static paused=false;static pausedAt=0;static acc=0;
 static start(from=Editor.idx){Presenter.i=from;Presenter.t0=Date.now();Presenter.acc=0;Presenter.paused=false;Presenter.on=true;const el=$('#present');el.classList.remove('hidden');
  if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});Presenter.draw();Presenter.timer=setInterval(Presenter.tick,500);
  Store.log('Tú','inició la presentación en vivo');Store.save()}
 static stop(){if(!Presenter.on)return;Presenter.on=false;clearInterval(Presenter.timer);$('#present').classList.add('hidden');$('#present').innerHTML='';if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});Editor.go(Presenter.i)}
 static elapsed(){return(Presenter.paused?Presenter.pausedAt:Date.now())-Presenter.t0-Presenter.acc}
 static tick(){const t=$('#pTimer'),c=$('#pClock');if(t)t.textContent=U.time(Presenter.elapsed());if(c)c.textContent=new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}
 static go(n,dir=1){const sl=Editor.project.slides;if(n<0||n>=sl.length){if(n>=sl.length)Presenter.draw(true);return}Presenter.i=n;Presenter.draw(false,dir)}
 static draw(end,dir){const el=$('#present'),sl=Editor.project.slides,s=sl[Presenter.i];
  if(end){el.innerHTML=`<div class="w-full h-full grid place-items-center text-white bg-slate-950"><div class="text-center"><div class="text-5xl font-extrabold mb-3">Fin de la presentación</div><p class="text-slate-400 mb-6">Duración: ${U.time(Presenter.elapsed())}</p><button class="btn btn-p" id="pExit">Salir</button> <button class="btn" id="pAgain">Volver a empezar</button></div></div>`;$('#pExit').onclick=Presenter.stop;$('#pAgain').onclick=()=>Presenter.go(0);return}
  const speaker=Presenter.view==='speaker';const W=innerWidth,Hh=innerHeight;
  const k=speaker?Math.min((W*.62)/SW,(Hh-120)/SH):Math.min(W/SW,Hh/SH);
  const anim=s.trans&&s.trans!=='none'?`animation:${Motion.anim(s.trans)};`:'';
  const main=`<div style="${anim}box-shadow:0 20px 80px #000a">${Render.full(s,k,true)}</div>`;
  if(!speaker){el.innerHTML=`<div class="w-full h-full grid place-items-center bg-black relative" id="pClick">${main}<div class="absolute bottom-3 right-4 text-xs text-white/40">${Presenter.i+1}/${sl.length} · V: vista orador · Esc: salir</div></div>`}
  else{const nx=sl[Presenter.i+1];
   el.innerHTML=`<div class="w-full h-full bg-slate-950 text-white flex flex-col" id="pClick"><div class="flex-1 flex min-h-0 gap-4 p-4"><div class="flex-1 grid place-items-center min-w-0">${main}</div>
    <div class="w-[34%] max-w-md flex flex-col gap-3 min-h-0"><div class="rounded-2xl bg-white/5 border border-white/10 p-4 flex items-center justify-around"><div class="text-center"><div class="text-[10px] uppercase tracking-widest text-slate-400">Tiempo</div><div id="pTimer" class="text-3xl font-mono font-bold text-emerald-400">${U.time(Presenter.elapsed())}</div></div><div class="text-center"><div class="text-[10px] uppercase tracking-widest text-slate-400">Hora</div><div id="pClock" class="text-3xl font-mono font-bold">--:--</div></div></div>
    <div class="rounded-2xl bg-white/5 border border-white/10 p-3"><div class="text-[10px] uppercase tracking-widest text-slate-400 mb-1">Siguiente</div>${nx?Render.thumb(nx,Math.min(300,W*.3)):'<div class="text-sm text-slate-400 py-6 text-center">Última diapositiva</div>'}</div>
    <div class="rounded-2xl bg-white/5 border border-white/10 p-4 flex-1 min-h-0 overflow-auto"><div class="text-[10px] uppercase tracking-widest text-slate-400 mb-1">Notas del orador</div><p class="text-lg leading-relaxed whitespace-pre-wrap">${U.esc(s.notes||'Sin notas para esta diapositiva.')}</p></div></div></div>
    <div class="h-14 shrink-0 flex items-center justify-center gap-3 border-t border-white/10 bg-black/40"><button class="btn !bg-white/10 !text-white !border-white/10" id="pPrev">◀ Anterior</button><span class="text-sm w-20 text-center">${Presenter.i+1} / ${sl.length}</span><button class="btn !bg-white/10 !text-white !border-white/10" id="pNext">Siguiente ▶</button><button class="btn !bg-white/10 !text-white !border-white/10" id="pPause">${Presenter.paused?'▶ Reanudar':'⏸ Pausar'} reloj</button><button class="btn !bg-white/10 !text-white !border-white/10" id="pReset">↺ Reiniciar reloj</button><button class="btn !bg-white/10 !text-white !border-white/10" id="pView">🖥 Vista limpia (V)</button><button class="btn !bg-rose-600 !text-white !border-transparent" id="pExit">✕ Salir</button></div></div>`;
   $('#pPrev').onclick=()=>Presenter.go(Presenter.i-1);$('#pNext').onclick=()=>Presenter.go(Presenter.i+1);$('#pExit').onclick=Presenter.stop;$('#pView').onclick=()=>Presenter.toggleView();$('#pReset').onclick=()=>{Presenter.t0=Date.now();Presenter.acc=0;Presenter.tick()};
   $('#pPause').onclick=()=>{if(Presenter.paused){Presenter.acc+=Date.now()-Presenter.pausedAt;Presenter.paused=false}else{Presenter.paused=true;Presenter.pausedAt=Date.now()}Presenter.draw()};Presenter.tick()}
  const c=$('#pClick');c.onclick=e=>{if(e.target.closest('button'))return;if(Presenter.view==='clean')Presenter.go(Presenter.i+1)}}
 static toggleView(){Presenter.view=Presenter.view==='speaker'?'clean':'speaker';Presenter.draw()}
 static key(e){if(!Presenter.on)return false;const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k))Presenter.go(Presenter.i+1);
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k))Presenter.go(Presenter.i-1);
  else if(k==='Home')Presenter.go(0);else if(k==='End')Presenter.go(Editor.project.slides.length-1);
  else if(k==='Escape')Presenter.stop();else if(k.toLowerCase()==='v')Presenter.toggleView();
  else if(k.toLowerCase()==='f'){if(document.fullscreenElement)document.exitFullscreen();else $('#present').requestFullscreen&&$('#present').requestFullscreen()}
  else if(k.toLowerCase()==='p'){const b=$('#pPause');if(b)b.click()}
  else return true;e.preventDefault();return true}
}

 static key(e){if(Presenter.on){Presenter.key(e);return}

  if(ctrl&&k==='c'){Editor.copy();return}if(ctrl&&k==='v'){return}
  if(ctrl&&k==='x'){Editor.copy();Editor.remove();return}
  if(ctrl&&k==='d'){e.preventDefault();Editor.duplicate();return}
  if(ctrl&&k==='g'){e.preventDefault();e.shiftKey?Editor.ungroup():Editor.group();return}
  if(ctrl&&k==='a'){e.preventDefault();Editor.select(Editor.slide.els.map(x=>x.id));return}
  if(ctrl&&k==='s'){e.preventDefault();Store.save();UI.toast('Guardado');return}
  if(ctrl&&(k==='='||k==='+')){e.preventDefault();Editor.setZoom(Editor.zoom+.1);return}if(ctrl&&k==='-'){e.preventDefault();Editor.setZoom(Editor.zoom-.1);return}if(ctrl&&k==='0'){e.preventDefault();Editor.fit();return}
  if(e.key==='Delete'||e.key==='Backspace'){if(Editor.sel.length){e.preventDefault();Editor.remove()}return}
  if(e.key.startsWith('Arrow')){if(Editor.sel.length){e.preventDefault();const s=e.shiftKey?10:1;Editor.nudge(e.key==='ArrowLeft'?-s:e.key==='ArrowRight'?s:0,e.key==='ArrowUp'?-s:e.key==='ArrowDown'?s:0);Editor.snapSoon()}else{if(e.key==='ArrowLeft'||e.key==='ArrowUp')Editor.go(Editor.idx-1);else Editor.go(Editor.idx+1)}return}
  if(e.key==='F5'||(ctrl&&e.key==='Enter')){e.preventDefault();Presenter.start(e.shiftKey?Editor.idx:0)}}
}
window.addEventListener('paste',e=>{if(Editor.readOnly||/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if([...(e.clipboardData?.items||[])].some(i=>i.type.startsWith('image/')))return;Editor.paste()});
document.addEventListener('DOMContentLoaded',App.init);
</script></body></html>
